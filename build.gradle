plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.116'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    // CompixelUI is published only here; other repositories are never asked for it, so their outages cannot fail
    // the build.
    exclusiveContent {
        forRepository {
            maven {
                name = 'CompixelUI'
                // Local development can override this with -Pcompixel_repository=<Maven directory>.
                url = uri(providers.gradleProperty('compixel_repository').orElse('https://maven.wintercogs.com/releases').get())
            }
        }
        filter { includeGroup 'dev.compixel' }
    }
    maven {
        url = "https://maven.blamejared.com"
    }
    maven { url 'https://modmaven.dev/' }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    // kubejs
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }

    maven {
        url 'https://maven.aliyun.com/repository/public'
    }
}

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin.jvmToolchain(21)

// 发布时附带源码包，引用 BD 的项目在 IDE 里能直接看到原始代码
java.withSourcesJar()

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            jvmArguments = ['-Xms6G','-Xmx8G']
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            jvmArguments = ['-Xms6G','-Xmx8G']
            programArgument ''
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {

    // CompixelUI 单独安装：编译用带 Kotlin 的坐标，运行用标准版并由 Kotlin for Forge 提供 Kotlin，与玩家装 KFF 时相同。
    // 标准版写进发布的 POM，引用 BD 的项目会自动带上它
    compileOnly "dev.compixel:compixel-neoforge-1.21.1-with-kotlin:${compixel_version}"
    runtimeOnly "dev.compixel:compixel-neoforge-1.21.1:${compixel_version}"
    localRuntime "maven.modrinth:kotlin-for-forge:${kff_version}"

    // 引入对拼音库的依赖 并将其打包到模组
    jarJar(implementation group: 'com.github.promeg', name: 'tinypinyin', version: '2.0.3'){
        version {
            strictly '[2.0.3,)'
            prefer '2.0.3'
        }
    }
    // 必须要在此显式声明依赖，否则在运行时会找不到
    additionalRuntimeClasspath "com.github.promeg:tinypinyin:2.0.3"


    // 通用机械 以便使用化学品存储
    compileOnly "mekanism:Mekanism:${mekanism_version}"
    localRuntime "mekanism:Mekanism:${mekanism_version}"

    // EMI支持
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    //runtimeOnly "dev.emi:emi-neoforge:${emi_version}"

    // JEI支持
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Jade支持
    compileOnly "curse.maven:jade-324717:7545219"
    localRuntime "curse.maven:jade-324717:7545219"

    // 多态合成支持
    compileOnly "curse.maven:polymorph-388800:6451024"
    localRuntime "curse.maven:polymorph-388800:6451024"

    // AE支持
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae_version}"
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae_version}"
    compileOnly "curse.maven:applied-mekanistics-574300:5978711" // AE的通用机械附属
    localRuntime "curse.maven:applied-mekanistics-574300:5978711" // AE的通用机械附属
    compileOnly "curse.maven:applied-flux-965012:6649565" // 应用通量附属
    localRuntime "curse.maven:applied-flux-965012:6649565" // 应用通量附属
    localRuntime "curse.maven:glodium-957920:5821676" // ae flux 前置
    localRuntime "maven.modrinth:guideme:21.1.15" // guideme

    // 饰品栏支持
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}"

    // 在本模组的UI禁用IPN 不启用runtime
    compileOnly "maven.modrinth:inventory-profiles-next:neoforge-1.21.1-2.1.9"

    // kubejs
    compileOnly "dev.latvian.mods:kubejs-neoforge:$kubejs_version"

    // 通用拼音搜索-在安装时优先使用它的拼音处理 不启用runtime：会导致runServer失败
    compileOnly "curse.maven:just-enough-characters-250702:6681787"

    // RS支持
    compileOnly "maven.modrinth:refined-storage:2.0.0-beta.7"
    localRuntime "maven.modrinth:refined-storage:2.0.0-beta.7"
    // RS 通用机械附属
    compileOnly "maven.modrinth:refined-storage-mekanism-integration:1.0.0"
    localRuntime "maven.modrinth:refined-storage-mekanism-integration:1.0.0"
    // RS Types附属
    compileOnly "curse.maven:refined-types-1327983:6904430"
    localRuntime "curse.maven:refined-types-1327983:6904430"

    // 工业先锋：灵魂涌动
    compileOnly "maven.modrinth:industrial-foregoing-souls:1.21-1.10.5"
    compileOnly "curse.maven:soulplied-energistics-1143614:6771121" // AE联动
    localRuntime "maven.modrinth:industrial-foregoing-souls:1.21-1.10.5"
    localRuntime "curse.maven:soulplied-energistics-1143614:6771121"
    localRuntime "maven.modrinth:industrial-foregoing:1.21-3.6.36"
    localRuntime "maven.modrinth:titanium:1.21-4.0.40"

    // 新生魔艺
    compileOnly "maven.modrinth:ars-nouveau:5.10.3"
    compileOnly "maven.modrinth:ars-energistique:2.1.1-beta" // AE联动
    localRuntime "maven.modrinth:ars-nouveau:5.10.3"
    localRuntime "maven.modrinth:ars-energistique:2.1.1-beta"
    localRuntime "maven.modrinth:geckolib:RVIo5f6E" // geckolib
    localRuntime "maven.modrinth:patchouli:1.21.1-92-neoforge" // 帕秋莎

    // 植物魔法以及其ae附属
    compileOnly "vazkii.botania:botania-neoforge-1.21.1:454-SNAPSHOT"
    localRuntime "vazkii.botania:botania-neoforge-1.21.1:454-SNAPSHOT"
    // ae-botania对botania新版api的注册时机有一点问题，保留兼容暂不纳入运行
    compileOnly "curse.maven:applied-botanics-addon-610632:8298277"

    // 机械动力支持 - 蓝图炮
    compileOnly "maven.modrinth:create:mc1.21.1-6.0.9"
    localRuntime "maven.modrinth:create:mc1.21.1-6.0.9"

    compileOnly "net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.69"

    // 精妙背包以及精妙存储调试
    localRuntime "curse.maven:sophisticated-backpacks-422301:6679417"
    localRuntime "curse.maven:sophisticated-storage-619320:6712033"
    localRuntime "curse.maven:sophisticated-core-618298:6680823"

}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            compixel_version       : compixel_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata

// Include Licenses
tasks.named('processResources', ProcessResources).configure {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }

    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into 'META-INF'
    }

    from(rootProject.file('licenses')) {
        into 'META-INF/licenses'
    }
}

// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// 发布到 wintercogs Maven：模组 jar、源码包与 POM。上传凭据读 Gradle 属性 wintercogsUsername 与 wintercogsPassword
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = 'wintercogs'
            url = 'https://maven.wintercogs.com/releases'
            credentials(PasswordCredentials)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

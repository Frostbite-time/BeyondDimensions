plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com"
    }
    maven { url 'https://modmaven.dev/' }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url 'https://maven.aliyun.com/repository/public'
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    maven {
        name = "IPN-Releases"
        mavenContent {
            releasesOnly()
        }
        content {
            includeGroup("org.anti_ad.mc")
            includeGroup("ca.solo-studios")
        }
        url = uri("https://maven.ipn-mod.org/releases")
    }

    // kubejs
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }

    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Specify the version of MinecraftForge to use.
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument ''
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called 'modLocalRuntime'
// These configurations should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {

    compileOnly "org.jetbrains:annotations:26.0.2"

    // 引入对拼音库的依赖 并将其打包到模组
    jarJar(implementation group: 'com.github.promeg', name: 'tinypinyin', version: '2.0.3'){
        version {
            strictly '[2.0.3,)'
            prefer '2.0.3'
        }
    }
    // 必须要在此显式声明依赖，否则在运行时会找不到
    additionalRuntimeClasspath "com.github.promeg:tinypinyin:2.0.3"


    // 编译通用机械的api 以便使用化学品存储
    modCompileOnly "mekanism:Mekanism:${mekanism_version}:api"
    modLocalRuntime "mekanism:Mekanism:${mekanism_version}"

    // EMI支持
    modCompileOnly "dev.emi:emi-forge:${emi_version}:api"

    // JEI支持
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"

    modLocalRuntime "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"

    // 多态合成支持
    modCompileOnly "curse.maven:polymorph-388800:4928442"

    // AE支持
    modCompileOnly "maven.modrinth:ae2:Zfyso1sP"
    modLocalRuntime "maven.modrinth:ae2:Zfyso1sP"
    modLocalRuntime "maven.modrinth:guideme:20.1.11"
    modCompileOnly "curse.maven:applied-mekanistics-574300:4842281" // AE的通用机械附属
    modLocalRuntime "curse.maven:applied-mekanistics-574300:4842281" // AE的通用机械附属
    modCompileOnly "curse.maven:applied-flux-965012:6649403" // 应用通量
    modLocalRuntime "curse.maven:applied-flux-965012:6649403" // 应用通量
    modLocalRuntime "maven.modrinth:glodium:1.20-1.5-forge" // 应用通量

    // Curios支持
    modCompileOnly "top.theillusivec4.curios:curios-forge:${curios_version}+${minecraft_version}:api"
    modLocalRuntime "top.theillusivec4.curios:curios-forge:${curios_version}+${minecraft_version}"

    // kubejs
    modCompileOnly "dev.latvian.mods:kubejs-forge:${kubejs_version}"

    // 在模组界面禁用IPN的功能
    modCompileOnly "org.anti_ad.mc:InventoryProfilesNext-forge-1.20:1.10.7"

    // 通用拼音搜索的引入
    modCompileOnly "curse.maven:just-enough-characters-250702:6680042"
    //modRuntimeOnly "curse.maven:just-enough-characters-250702:6680042"

    // 新生魔艺兼容
    modCompileOnly "maven.modrinth:ars-nouveau:4.12.7"
    modCompileOnly "maven.modrinth:ars-energistique:1.2.0" // AE附属
    modLocalRuntime "maven.modrinth:ars-energistique:1.2.0" // AE附属
    modLocalRuntime "maven.modrinth:ars-nouveau:4.12.7"
    modLocalRuntime "maven.modrinth:geckolib:39SztbiB"
    modLocalRuntime "maven.modrinth:patchouli:1.20.1-84.1-forge"

    // 植物魔法兼容
    modCompileOnly "maven.modrinth:botania:1.20.1-450-forge"
    modLocalRuntime "maven.modrinth:botania:1.20.1-450-forge"
    modCompileOnly "maven.modrinth:applied-botanics:1.5.0-forge"
    //modLocalRuntime "maven.modrinth:applied-botanics:1.5.0-forge" //在服务端加载了客户端类，无法运行

    // RS兼容
    modCompileOnly "maven.modrinth:refined-storage:1.12.4"
    modLocalRuntime "maven.modrinth:refined-storage:1.12.4"

    // 机械动力支持 - 蓝图炮
    modCompileOnly "maven.modrinth:create:mc1.20.1-6.0.8"
    modLocalRuntime "maven.modrinth:create:mc1.20.1-6.0.8"

    modCompileOnly "net.createmod.ponder:Ponder-Forge-1.20.1:1.0.92"

    modLocalRuntime "curse.maven:sophisticated-core-618298:6596375"
    modLocalRuntime "curse.maven:sophisticated-backpacks-422301:6587116"
}

// Uncomment the lines below if you wish to configure mixin. The mixin file should be named modid.mixins.json.
/*
